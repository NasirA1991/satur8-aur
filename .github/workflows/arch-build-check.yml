name: Arch build check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out packaging repository
        uses: actions/checkout@v7

      - name: Build package in an Arch container
        run: |
          set -euo pipefail

          build_dir="$(mktemp -d)"
          cp PKGBUILD "${build_dir}/"
          curl -fsSL --retry 3 \
            -o "${build_dir}/satur8-v0.3.3-source.tar.gz" \
            "https://github.com/NtrpyDev/satur8/releases/download/v0.3.3/satur8-v0.3.3-source.tar.gz"

          docker run --rm \
            -e HOST_UID="$(id -u)" \
            -v "${build_dir}:/work" \
            -w /work \
            archlinux:base-devel \
            bash -euc '
              pacman -Syu --noconfirm --needed rust cmake kwin qt6-base qt6-declarative kcoreaddons kconfig >/tmp/pacman.log 2>&1 || { tail -50 /tmp/pacman.log; exit 1; }
              useradd -m -u "$HOST_UID" builder
              su builder -c "SRCDEST=/work makepkg --nodeps --nocheck --noconfirm"
            '

          ls -lh "${build_dir}"/*.pkg.tar.*
